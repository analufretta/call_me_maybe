[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling for LLMs via constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.mypy]
python_version = "3.10"

[tool.flake8]
max-line-length = 100
extend-exclude = ["llm_sdk", ".venv"]
