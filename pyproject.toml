[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling for LLMs via constrained decoding"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "llm-sdk",
    "pydantic>=2",
    "transformers==4.51.3",
    # Intel Macs: last torch with wheels is 2.2.2 (needs numpy<2, Python<=3.12)
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Everywhere else (school Linux, Python 3.13)
    "torch==2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=2.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.mypy]
python_version = "3.10"

[tool.flake8]
max-line-length = 100
extend-exclude = ["llm_sdk", ".venv"]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
