[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling for LLMs via constrained decoding"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "llm-sdk",
    "numpy<2",
    "pydantic>=2",
    "torch==2.6.0",
    "transformers==4.51.3",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest"
]

[tool.mypy]
python_version = "3.10"

[tool.flake8]
max-line-length = 100
extend-exclude = ["llm_sdk", ".venv"]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
